<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casório.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e7;
    --card: #fffdf9;
    --accent: #1f2c47;
    --accent-dark: #141d30;
    --gold: #c9a15a;
    --gold-dark: #a8813f;
    --brown: #6e3d2e;
    --brown-dark: #4f2a1f;
    --text: #2b2318;
    --muted: #8a7b64;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-size: 18px;
    background: linear-gradient(180deg, var(--bg), #efe6d3);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 100%;
    background-image:
      linear-gradient(180deg, rgba(246,241,231,0.55), rgba(239,230,211,0.7)),
      url('/assets/casal.jpg');
    background-size: cover;
    background-position: center 25%;
    background-repeat: no-repeat;
    opacity: 0.85;
    filter: grayscale(25%) sepia(15%) brightness(1.05) contrast(95%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 78%);
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 78%);
    z-index: 0;
    pointer-events: none;
  }
  .card {
    background: rgba(255,253,249,0.92);
    max-width: 520px;
    width: 100%;
    border-radius: 18px;
    padding: 36px 28px;
    box-shadow: 0 10px 30px rgba(31,44,71,0.12);
    border-top: 4px solid var(--gold);
    position: relative;
    z-index: 1;
    backdrop-filter: blur(2px);
  }
  h1 {
    text-align: center;
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 2.1rem;
    margin: 0 0 4px;
    color: var(--accent-dark);
  }
  .sub {
    text-align: center;
    color: var(--muted);
    margin-bottom: 26px;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .pessoa {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid #f0e3db;
  }
  .pessoa:last-child { border-bottom: none; }
  .pessoa-nome {
    font-size: 1.2rem;
    font-weight: 600;
  }
  .toggle-group {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .toggle-group button {
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid #e3d5cd;
    background: #fffaf7;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
    white-space: nowrap;
  }
  .toggle-group button.selected.yes { background: #f2e3bd; border-color: var(--gold-dark); color: #6b5219; }
  .toggle-group button.selected.no { background: #e9d9d2; border-color: var(--brown); color: var(--brown-dark); }
  label {
    display: block;
    margin-top: 22px;
    font-weight: bold;
    font-size: 0.9rem;
  }
  textarea {
    width: 100%;
    margin-top: 6px;
    padding: 10px 12px;
    border: 1px solid #e3d5cd;
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
    background: #fffaf7;
    resize: vertical;
  }
  button[type="submit"] {
    margin-top: 26px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--gold);
    color: var(--accent-dark);
    font-weight: bold;
    font-size: 1.05rem;
    cursor: pointer;
    font-family: inherit;
  }
  button[type="submit"]:hover { background: var(--gold-dark); }
  #msg { margin-top: 16px; text-align: center; font-size: 0.95rem; }
  #msg.err { color: var(--brown-dark); }
  #msg.ok { color: var(--gold-dark); }
  .success-screen { text-align: center; }
  .success-screen .icon { font-size: 3rem; }
  .erro-screen { text-align: center; color: var(--muted); }
</style>
</head>
<body>
  <div class="card" id="app">
    <p style="text-align:center;">Carregando convite...</p>
  </div>

<script>
  const token = location.pathname.split('/').filter(Boolean).pop();
  const app = document.getElementById('app');
  let pessoas = [];
  let weddingInfo = null;

  function formatarData(iso) {
    const [ano, mes, dia] = iso.split('-');
    return `${dia}/${mes}/${ano}`;
  }

  async function carregar() {
    try {
      const [cfgRes, convRes] = await Promise.all([
        fetch('/api/config'),
        fetch('/api/convite/' + token),
      ]);

      if (!convRes.ok) {
        app.innerHTML = `
          <div class="erro-screen">
            <div style="font-size:3rem;">💔</div>
            <h1>Convite não encontrado</h1>
            <p class="sub">Verifique o link recebido ou fale com os noivos.</p>
          </div>`;
        return;
      }

      weddingInfo = await cfgRes.json();
      const convite = await convRes.json();
      pessoas = convite.pessoas.map(p => ({ ...p }));

      render(convite);
    } catch (e) {
      app.innerHTML = `<p style="text-align:center;">Erro ao carregar o convite. Tente novamente.</p>`;
    }
  }

  function render(convite) {
    const pessoasHtml = pessoas.map(p => `
      <div class="pessoa" data-id="${p.id}">
        <div class="pessoa-nome">${escapeHtml(p.nome)}</div>
        <div class="toggle-group">
          <button type="button" class="btn-sim ${p.vai === true ? 'selected yes' : ''}" onclick="selecionar('${p.id}', true)">Vou 🎉</button>
          <button type="button" class="btn-nao ${p.vai === false ? 'selected no' : ''}" onclick="selecionar('${p.id}', false)">Não vou</button>
        </div>
      </div>
    `).join('');

    app.innerHTML = `
      <h1>${escapeHtml(convite.titulo)}</h1>
      <p class="sub">${escapeHtml(weddingInfo.noivos)} · ${formatarData(weddingInfo.data)} às ${escapeHtml(weddingInfo.horario)}<br>${escapeHtml(weddingInfo.local)}</p>

      <form id="rsvpForm">
        ${pessoasHtml}

        <label for="mensagem">Mensagem para os noivos (opcional)</label>
        <textarea id="mensagem" rows="3" placeholder="Deixe um recado carinhoso...">${escapeHtml(convite.mensagem || '')}</textarea>

        <button type="submit">${convite.confirmadoEm ? 'Atualizar confirmação' : 'Enviar confirmação'}</button>
        <div id="msg"></div>
      </form>
    `;

    document.getElementById('rsvpForm').addEventListener('submit', enviar);
  }

  function selecionar(id, vai) {
    const p = pessoas.find(p => p.id === id);
    p.vai = vai;
    const row = document.querySelector(`.pessoa[data-id="${id}"]`);
    row.querySelector('.btn-sim').classList.toggle('selected', vai === true);
    row.querySelector('.btn-sim').classList.toggle('yes', true);
    row.querySelector('.btn-nao').classList.toggle('selected', vai === false);
    row.querySelector('.btn-nao').classList.toggle('no', true);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function enviar(e) {
    e.preventDefault();
    const msgEl = document.getElementById('msg');
    msgEl.textContent = '';
    msgEl.className = '';

    if (pessoas.some(p => p.vai === null || p.vai === undefined)) {
      msgEl.textContent = 'Por favor, confirme a presença de todos antes de enviar.';
      msgEl.className = 'err';
      return;
    }

    const respostas = pessoas.map(p => ({ id: p.id, vai: p.vai }));
    const mensagem = document.getElementById('mensagem').value.trim();

    try {
      const res = await fetch('/api/convite/' + token + '/confirmar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ respostas, mensagem }),
      });
      if (!res.ok) throw new Error('Falha ao enviar');

      const algumVai = pessoas.some(p => p.vai === true);
      const titulo = algumVai ? 'Obrigado!' : 'Sentiremos sua falta';
      const texto = algumVai
        ? 'Agradecemos imensamente por confirmar sua presença nesta data tão importante para nós. Mal podemos esperar para celebrar esse momento tão especial ao seu lado!'
        : 'Compreendemos sua ausência. Mesmo não podendo estar presente fisicamente, saiba que você estará em nossos corações neste dia tão importante para nós.';
      app.innerHTML = `
        <div class="success-screen">
          <div class="icon">${algumVai ? '💌' : '🤍'}</div>
          <h1>${titulo}</h1>
          <p class="sub">${texto}</p>
        </div>`;
    } catch (err) {
      msgEl.textContent = 'Ocorreu um erro ao enviar. Tente novamente.';
      msgEl.className = 'err';
    }
  }

  carregar();
</script>
</body>
</html>
