<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casório.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e7;
    --card: #fffdf9;
    --accent: #1f2c47;
    --accent-dark: #141d30;
    --gold: #c9a15a;
    --gold-dark: #a8813f;
    --brown-dark: #4f2a1f;
    --text: #2b2318;
    --muted: #6b5d47;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
    font-size: 18px;
    background: linear-gradient(180deg, var(--bg), #efe6d3);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    max-width: 380px;
    width: 100%;
    padding: 40px 32px;
    border-radius: 18px;
    box-shadow: 0 14px 36px rgba(31,44,71,0.16);
    border-top: 4px solid var(--gold);
    text-align: center;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 1.7rem;
    color: var(--accent-dark);
    margin: 0 0 6px;
  }
  .sub {
    color: var(--muted);
    font-size: 1.1rem;
    margin: 0 0 26px;
  }
  label {
    display: block;
    text-align: left;
    font-weight: 600;
    font-size: 1rem;
    font-family: 'Segoe UI', Arial, sans-serif;
    margin-top: 16px;
  }
  input {
    width: 100%;
    margin-top: 6px;
    padding: 11px 12px;
    border: 1px solid #e3d5cd;
    border-radius: 10px;
    font-size: 1.05rem;
    font-family: inherit;
    background: #fffaf7;
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: var(--gold);
    color: var(--accent-dark);
    font-weight: 700;
    font-size: 1.05rem;
    font-family: 'Segoe UI', Arial, sans-serif;
    cursor: pointer;
  }
  button:hover { background: var(--gold-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  #msg {
    margin-top: 16px;
    font-size: 1rem;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--brown-dark);
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>💍 Meu Casório</h1>
    <p class="sub">Painel dos noivos</p>

    <form id="loginForm">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required>

      <button type="submit" id="btnEntrar">Entrar</button>
      <p id="msg"></p>
    </form>
  </div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnEntrar');
    const msg = document.getElementById('msg');
    msg.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          usuario: document.getElementById('usuario').value,
          senha: document.getElementById('senha').value,
        }),
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/admin';
        return;
      }
      msg.textContent = data.error || 'Não foi possível entrar.';
    } catch (err) {
      msg.textContent = 'Erro de conexão. Tente novamente.';
    }
    btn.disabled = false;
    btn.textContent = 'Entrar';
  });
</script>
</body>
</html>
