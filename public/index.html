<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casório.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e7;
    --card: #fffdf9;
    --accent: #1f2c47;
    --accent-dark: #141d30;
    --gold: #c9a15a;
    --gold-dark: #a8813f;
    --brown: #6e3d2e;
    --brown-dark: #4f2a1f;
    --text: #2b2318;
    --muted: #6b5d47;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
    font-size: 18px;
    background: linear-gradient(180deg, var(--bg), #efe6d3);
    color: var(--text);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    position: relative;
    overflow: hidden;
  }
  .flora {
    position: fixed;
    width: 340px;
    height: 340px;
    z-index: 0;
    pointer-events: none;
  }
  .flora--tl { top: -60px; left: -70px; }
  .flora--br { bottom: -60px; right: -70px; transform: rotate(180deg); }
  @media (max-width: 480px) {
    .flora { width: 220px; height: 220px; }
    .flora--tl { top: -40px; left: -60px; }
    .flora--br { bottom: -40px; right: -60px; }
  }
  .invite-card {
    max-width: 480px;
    width: 100%;
    height: fit-content;
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 14px 36px rgba(31,44,71,0.16);
    position: relative;
    z-index: 1;
  }
  .hero {
    width: 100%;
    aspect-ratio: 4 / 3;
    background-image:
      linear-gradient(180deg, rgba(20,29,48,0.05) 0%, rgba(20,29,48,0) 55%),
      url('/assets/casal-hero.jpg');
    background-size: cover;
    background-position: center 30%;
    background-repeat: no-repeat;
  }
  .card {
    padding: 32px 28px 36px;
    border-top: 4px solid var(--gold);
    text-align: center;
  }
  .eyebrow {
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .logo-mark { height: 1.6em; width: auto; }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 2.7rem;
    color: var(--accent-dark);
    margin: 0 0 8px;
  }
  .subinfo {
    color: var(--muted);
    font-size: 1.2rem;
    margin: 0 0 30px;
    line-height: 1.5;
  }
  .cta {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .cta a {
    display: block;
    padding: 14px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 700;
    font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
  }
  .cta .primary {
    background: var(--gold);
    color: var(--accent-dark);
  }
  .cta .primary:hover { background: var(--gold-dark); }
  .cta .secondary {
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
  }
  .cta .secondary:hover { background: var(--accent); color: #fff; }
  .guest-note {
    margin-top: 18px;
    font-size: 1rem;
    color: var(--muted);
    display: none;
  }
  .guest-note.show { display: block; }
</style>
</head>
<body>
  <svg class="flora flora--tl" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="soften1" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="9"/>
      </filter>
      <radialGradient id="gGold" cx="35%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#e3c184"/>
        <stop offset="100%" stop-color="#a8813f"/>
      </radialGradient>
      <radialGradient id="gBrown" cx="35%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#8a5842"/>
        <stop offset="100%" stop-color="#4f2a1f"/>
      </radialGradient>
    </defs>
    <g filter="url(#soften1)" opacity="0.5">
      <circle cx="55" cy="45" r="58" fill="url(#gGold)"/>
      <circle cx="115" cy="90" r="42" fill="url(#gBrown)"/>
      <circle cx="35" cy="120" r="36" fill="url(#gGold)"/>
      <circle cx="150" cy="40" r="30" fill="url(#gBrown)"/>
    </g>
    <g fill="none" stroke="#6e3d2e" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
      <path d="M20,150 C40,110 30,70 55,35 C75,8 105,15 100,35 C95,55 65,55 60,40"/>
      <path d="M60,90 C75,80 90,85 95,100"/>
      <path d="M40,110 C55,105 65,112 68,125"/>
    </g>
    <g stroke="#4f2a1f" stroke-width="1.4" fill="none" opacity="0.9">
      <path d="M55,35 c-14,-16 -36,-14 -40,2 c-4,15 16,24 40,10 c24,14 44,4 39,-11 c-5,-15 -25,-16 -39,-1 Z"/>
      <path d="M115,90 c-10,-11 -25,-9 -28,2 c-3,10 11,17 28,7 c17,10 31,2 27,-9 c-4,-11 -18,-11 -27,0 Z"/>
    </g>
    <g fill="#8a7b64" opacity="0.55">
      <path d="M25,140 q18,-6 22,10 q-18,8 -22,-10 Z"/>
      <path d="M70,120 q16,-8 22,6 q-16,10 -22,-6 Z"/>
    </g>
  </svg>
  <svg class="flora flora--br" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="soften2" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="9"/>
      </filter>
      <radialGradient id="gGold2" cx="35%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#e3c184"/>
        <stop offset="100%" stop-color="#a8813f"/>
      </radialGradient>
      <radialGradient id="gBrown2" cx="35%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#8a5842"/>
        <stop offset="100%" stop-color="#4f2a1f"/>
      </radialGradient>
    </defs>
    <g filter="url(#soften2)" opacity="0.5">
      <circle cx="55" cy="45" r="58" fill="url(#gGold2)"/>
      <circle cx="115" cy="90" r="42" fill="url(#gBrown2)"/>
      <circle cx="35" cy="120" r="36" fill="url(#gGold2)"/>
      <circle cx="150" cy="40" r="30" fill="url(#gBrown2)"/>
    </g>
    <g fill="none" stroke="#6e3d2e" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
      <path d="M20,150 C40,110 30,70 55,35 C75,8 105,15 100,35 C95,55 65,55 60,40"/>
      <path d="M60,90 C75,80 90,85 95,100"/>
      <path d="M40,110 C55,105 65,112 68,125"/>
    </g>
    <g stroke="#4f2a1f" stroke-width="1.4" fill="none" opacity="0.9">
      <path d="M55,35 c-14,-16 -36,-14 -40,2 c-4,15 16,24 40,10 c24,14 44,4 39,-11 c-5,-15 -25,-16 -39,-1 Z"/>
      <path d="M115,90 c-10,-11 -25,-9 -28,2 c-3,10 11,17 28,7 c17,10 31,2 27,-9 c-4,-11 -18,-11 -27,0 Z"/>
    </g>
    <g fill="#8a7b64" opacity="0.55">
      <path d="M25,140 q18,-6 22,10 q-18,8 -22,-10 Z"/>
      <path d="M70,120 q16,-8 22,6 q-16,10 -22,-6 Z"/>
    </g>
  </svg>
  <div class="invite-card">
    <div class="hero"></div>
    <div class="card">
      <p class="eyebrow"><img class="logo-mark" src="/assets/logo-aliancas-crop.png" alt=""> Convite de Casamento</p>
      <h1 id="noivos">Carregando...</h1>
      <p class="subinfo" id="detalhes"></p>

      <div class="cta">
        <a class="secondary" href="#" id="btnConvidado">Sou convidado</a>
        <a class="primary" href="/admin">Painel dos noivos</a>
      </div>
      <p class="guest-note" id="guestNote">Use o link pessoal que você recebeu pelo WhatsApp para confirmar presença (algo como <code>/convite/xxxxx</code>). Não recebeu? Fale diretamente com os noivos.</p>
    </div>
  </div>

<script>
  fetch('/api/config').then(r => r.json()).then(cfg => {
    document.getElementById('noivos').textContent = cfg.noivos;
    const [ano, mes, dia] = cfg.data.split('-');
    document.getElementById('detalhes').textContent =
      `${dia}/${mes}/${ano} às ${cfg.horario} · ${cfg.local}`;
  });

  document.getElementById('btnConvidado').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('guestNote').classList.toggle('show');
  });
</script>
</body>
</html>
