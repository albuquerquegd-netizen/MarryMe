<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP Casamento</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: linear-gradient(180deg, #f6f1e7, #efe6d3);
    color: #2b2318;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .box {
    background: #fffdf9;
    padding: 36px 28px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(31,44,71,0.12);
    max-width: 420px;
    border-top: 4px solid #c9a15a;
  }
  h1 { color: #1f2c47; margin-top: 0; }
  a { color: #a8813f; }
</style>
</head>
<body>
  <div class="box">
    <h1>💍 RSVP Casamento</h1>
    <p>Se você recebeu um convite, use o link pessoal enviado a você (algo como <code>/convite/xxxxx</code>).</p>
    <p>Se você é dos noivos, acesse o <a href="/admin">painel de convites</a>.</p>
  </div>
</body>
</html>
