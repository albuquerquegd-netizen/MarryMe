<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP Casamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e7;
    --card: #fffdf9;
    --accent: #1f2c47;
    --accent-dark: #141d30;
    --gold: #c9a15a;
    --gold-dark: #a8813f;
    --brown: #6e3d2e;
    --brown-dark: #4f2a1f;
    --text: #2b2318;
    --muted: #8a7b64;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-size: 18px;
    background: var(--bg);
    color: var(--text);
  }
  .hero {
    width: 100%;
    height: 46vh;
    min-height: 280px;
    max-height: 440px;
    background-image:
      linear-gradient(180deg, rgba(20,29,48,0.05) 0%, rgba(246,241,231,0.15) 70%, var(--bg) 98%),
      url('/assets/casal-hero.jpg');
    background-size: cover;
    background-position: center 32%;
    background-repeat: no-repeat;
    filter: saturate(0.92) contrast(0.98);
  }
  .content {
    display: flex;
    justify-content: center;
    padding: 0 16px 40px;
    margin-top: -70px;
    position: relative;
    z-index: 1;
  }
  .card {
    background: rgba(255,253,249,0.96);
    padding: 40px 32px 36px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(31,44,71,0.15);
    max-width: 460px;
    width: 100%;
    border-top: 4px solid var(--gold);
    text-align: center;
  }
  .eyebrow {
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 10px;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 2.6rem;
    color: var(--accent-dark);
    margin: 0 0 6px;
  }
  .subinfo {
    color: var(--muted);
    font-size: 1.05rem;
    margin: 0 0 30px;
    line-height: 1.5;
  }
  .cta {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .cta a {
    display: block;
    padding: 14px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .cta .primary {
    background: var(--gold);
    color: var(--accent-dark);
  }
  .cta .primary:hover { background: var(--gold-dark); }
  .cta .secondary {
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
  }
  .cta .secondary:hover { background: var(--accent); color: #fff; }
  .guest-note {
    margin-top: 18px;
    font-size: 0.9rem;
    color: var(--muted);
    display: none;
  }
  .guest-note.show { display: block; }
</style>
</head>
<body>
  <div class="hero"></div>
  <div class="content">
    <div class="card">
      <p class="eyebrow">💍 Convite de Casamento</p>
      <h1 id="noivos">Carregando...</h1>
      <p class="subinfo" id="detalhes"></p>

      <div class="cta">
        <a class="secondary" href="#" id="btnConvidado">Sou convidado</a>
        <a class="primary" href="/admin">Painel dos noivos</a>
      </div>
      <p class="guest-note" id="guestNote">Use o link pessoal que você recebeu pelo WhatsApp para confirmar presença (algo como <code>/convite/xxxxx</code>). Não recebeu? Fale diretamente com os noivos.</p>
    </div>
  </div>

<script>
  fetch('/api/config').then(r => r.json()).then(cfg => {
    document.getElementById('noivos').textContent = cfg.noivos;
    const [ano, mes, dia] = cfg.data.split('-');
    document.getElementById('detalhes').textContent =
      `${dia}/${mes}/${ano} às ${cfg.horario} · ${cfg.local}`;
  });

  document.getElementById('btnConvidado').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('guestNote').classList.toggle('show');
  });
</script>
</body>
</html>
